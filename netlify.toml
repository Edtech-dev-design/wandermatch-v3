# ==============================================================================
# Netlify Configuration for WanderMatch v3.0 Monorepo
# Frontend hosting with Reverse Proxy to Cloudflare Worker
# ==============================================================================

[build]
  publish = "frontend"

[dev]
  framework = "#static"
  targetPort = 8888
  port = 3000
  publish = "frontend"

# ==============================================================================
# REVERSE PROXY: Cầu nối ẩn chuyển tiếp toàn bộ /api/* sang Cloudflare Worker
# Triệt tiêu hoàn toàn lỗi CORS và bảo mật tuyệt đối địa chỉ máy chủ Worker
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://wandermatch-worker.workers.dev/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-Reverse-Proxy"}

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
