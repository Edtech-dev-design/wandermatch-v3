name: Auto Deploy WanderMatch Static Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage strictly allowlisted static frontend assets
        run: |
          mkdir -p _site
          cp index.html _site/
          cp facebook-auth.html _site/
          cp styles.css _site/
          cp app.js _site/
          cp supabaseClient.js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
